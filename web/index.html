<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Applawyer — маркетплейс юридических услуг в Казахстане">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Applawyer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Applawyer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f5f5; }

    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      z-index: 9999;
      gap: 16px;
    }
    #app-loading .logo-text {
      font-family: sans-serif;
      font-size: 22px;
      font-weight: bold;
      color: #A6192E;
      letter-spacing: 1px;
    }
    #app-loading .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #F2C4CB;
      border-top-color: #A6192E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #app-error {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <!-- Показывается пока Flutter загружается -->
  <div id="app-loading">
    <div class="logo-text">Applawyer</div>
    <div class="spinner"></div>
  </div>

  <!-- Показывается если Flutter не смог инициализироваться -->
  <div id="app-error"></div>

  <!-- Принудительно удаляем старый Service Worker и его кеши -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
      if (window.caches) {
        caches.keys().then(function (names) {
          names.forEach(function (name) { caches.delete(name); });
        });
      }
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
